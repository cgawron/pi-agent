---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: pi-agent-oauth2-proxy-credentials
  namespace: pi-agent
spec:
  encryptedData:
    OAUTH2_PROXY_CLIENT_ID: 
    OAUTH2_PROXY_CLIENT_SECRET: 
    OAUTH2_PROXY_COOKIE_SECRET: 
  template:
    metadata:
      name: pi-agent-oauth2-proxy-credentials
      namespace: pi-agent
    type: Opaque
