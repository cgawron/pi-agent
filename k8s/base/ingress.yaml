apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pi-agent
  namespace: pi-agent
spec:
  ingressClassName: traefik
  rules:
    - host: agent.gawron.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pi-agent
                port:
                  number: 8504
