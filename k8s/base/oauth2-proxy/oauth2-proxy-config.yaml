apiVersion: v1
kind: ConfigMap
metadata:
  name: pi-agent-oauth2-proxy-config
  namespace: pi-agent
data:
  OAUTH2_PROXY_PROVIDER: oidc
  OAUTH2_PROXY_OIDC_ISSUER_URL: https://keycloak.gawron.cloud/realms/private
  OAUTH2_PROXY_REDIRECT_URL: https://agent.gawron.cloud/oauth2/callback
  OAUTH2_PROXY_EMAIL_DOMAINS: "*"
  OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: /etc/oauth2-proxy/allowlist/allowed-users.txt
  OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
  OAUTH2_PROXY_UPSTREAMS: http://pi-agent.pi-agent.svc.cluster.local:8504/
  OAUTH2_PROXY_SCOPE: openid email profile
  OAUTH2_PROXY_REVERSE_PROXY: "true"
  OAUTH2_PROXY_PASS_HOST_HEADER: "true"
  OAUTH2_PROXY_COOKIE_SECURE: "true"
  OAUTH2_PROXY_COOKIE_SAMESITE: lax
  OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
