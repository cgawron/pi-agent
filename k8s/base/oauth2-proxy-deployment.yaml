apiVersion: apps/v1
kind: Deployment
metadata:
  name: pi-agent-oauth2-proxy
  namespace: pi-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pi-agent-oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pi-agent-oauth2-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4180
              protocol: TCP
          envFrom:
            - configMapRef:
                name: pi-agent-oauth2-proxy-config
            - secretRef:
                name: pi-agent-oauth2-proxy-credentials
          volumeMounts:
            - name: allowed-users
              mountPath: /etc/oauth2-proxy/allowlist
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: allowed-users
          configMap:
            name: pi-agent-oauth2-proxy-allowlist
            items:
              - key: allowed-users.txt
                path: allowed-users.txt
