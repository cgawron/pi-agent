apiVersion: apps/v1
kind: Deployment
metadata:
  name: pi-agent
  namespace: pi-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pi-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pi-agent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: pi-web-bootstrap
          image: ghcr.io/cgawron/pi-agent:main
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # The /home/node/.pi PVC covers the profile created in the image.
              # Register the image-bundled package in the persistent profile.
              pi install "$(npm root -g)/@jmfederico/pi-web/dist/pi-packages/scheduled-tasks"
              mkdir -p /home/node/.pi/web-data
              if [ ! -e /home/node/.pi/web-data/projects.json ]; then
                cp /etc/pi-web-bootstrap/projects.json /home/node/.pi/web-data/projects.json.tmp
                mv /home/node/.pi/web-data/projects.json.tmp /home/node/.pi/web-data/projects.json
              fi
              mkdir -p /vault/agent
              if [ ! -e /workspace/AGENTS.md ]; then
                : > /workspace/AGENTS.md
              fi
          volumeMounts:
            - name: pi-agent-data
              mountPath: /home/node/.pi
            - name: pi-web-bootstrap
              mountPath: /etc/pi-web-bootstrap
              readOnly: true
            - name: pi-agent-workspace
              mountPath: /workspace
            - name: pi-agent-obsidian-vault
              mountPath: /vault
      containers:
        - name: pi-agent
          image: ghcr.io/cgawron/pi-agent:main
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8504
              protocol: TCP
          env:
            - name: PI_WEB_HOST
              value: 0.0.0.0
            - name: PI_WEB_PORT
              value: "8504"
            - name: PI_WEB_DATA_DIR
              value: /home/node/.pi/web-data
            - name: PI_WEB_CONFIG
              value: /home/node/.pi/pi-web-config.json
            - name: PI_WEB_HOST_ACCESS
              value: '{"mode":"restricted","hosts":["agent.gawron.cloud"]}'
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pi-agent-model-credentials
                  key: OPENAI_API_KEY
            - name: COMPOSIO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pi-agent-composio-credentials
                  key: COMPOSIO_API_KEY
          envFrom:
            - secretRef:
                name: pi-agent-credentials
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: pi-agent-data
              mountPath: /home/node/.pi
            - name: pi-agent-model-config
              mountPath: /home/node/.pi/agent/models.json
              subPath: models.json
              readOnly: true
            - name: pi-agent-mcp-config
              mountPath: /home/node/.pi/agent/mcp.json
              subPath: mcp.json
              readOnly: true
            - name: pi-agent-workspace
              mountPath: /workspace
            - name: pi-agent-obsidian-vault
              mountPath: /workspace/vault
              readOnly: true
            - name: pi-agent-obsidian-vault
              mountPath: /workspace/vault/agent
              subPath: agent
            - name: pi-web-bootstrap
              mountPath: /workspace/AGENTS.md
              subPath: AGENTS.md
              readOnly: true
      volumes:
        - name: pi-agent-data
          persistentVolumeClaim:
            claimName: pi-agent-data
        - name: pi-agent-model-config
          configMap:
            name: pi-agent-model-config
        - name: pi-agent-mcp-config
          configMap:
            name: pi-agent-mcp-config
        - name: pi-agent-workspace
          persistentVolumeClaim:
            claimName: pi-agent-workspace
        - name: pi-agent-obsidian-vault
          persistentVolumeClaim:
            claimName: pi-agent-obsidian-vault
        - name: pi-web-bootstrap
          configMap:
            name: pi-agent-pi-web-bootstrap
