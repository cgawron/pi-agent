apiVersion: apps/v1
kind: Deployment
metadata:
  name: pi-agent
  namespace: pi-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pi-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pi-agent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pi-agent
          image: ghcr.io/cgawron/pi-agent:main
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8504
              protocol: TCP
          env:
            - name: PI_WEB_HOST
              value: 0.0.0.0
            - name: PI_WEB_PORT
              value: "8504"
          envFrom:
            - secretRef:
                name: pi-agent-credentials
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: pi-agent-data
              mountPath: /home/node/.pi
            - name: pi-agent-workspace
              mountPath: /workspace
      volumes:
        - name: pi-agent-data
          persistentVolumeClaim:
            claimName: pi-agent-data
        - name: pi-agent-workspace
          persistentVolumeClaim:
            claimName: pi-agent-workspace
