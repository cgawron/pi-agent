apiVersion: v1
kind: PersistentVolume
metadata:
  name: pi-agent-obsidian-vault
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 172.17.38.30
    path: /mnt/volume1/syncthing/FH-SWF/CGawron
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pi-agent-obsidian-vault
  namespace: pi-agent
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  storageClassName: ""
  volumeName: pi-agent-obsidian-vault
