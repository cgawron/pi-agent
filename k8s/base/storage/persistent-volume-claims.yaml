apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pi-agent-data
  namespace: pi-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pi-agent-workspace
  namespace: pi-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
