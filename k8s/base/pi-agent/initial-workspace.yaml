apiVersion: v1
kind: ConfigMap
metadata:
  name: pi-agent-pi-web-bootstrap
  namespace: pi-agent
data:
  projects.json: |
    {
      "projects": [
        {
          "id": "b8ee990c-7449-4dfa-95fb-34c6c5a31866",
          "name": "workspace",
          "path": "/workspace",
          "createdAt": "2026-11-24T22:30:30.471Z"
        }
      ]
    }
  AGENTS.md: |
    # Obsidian vault policy

    The Obsidian vault is mounted at `/workspace/vault`. You may read all of its
    contents. Do not create, edit, rename, delete, move, or overwrite anything
    outside `/workspace/vault/agent/`.

    Put all notes, summaries, reports, and other files you create in the vault
    under `/workspace/vault/agent/`. The `agent` folder is writable; the rest of
    the vault is mounted read-only.
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: pi-agent-initial-workspace
  namespace: pi-agent
spec:
  redirectRegex:
    regex: ^https?://agent\.gawron\.cloud/$
    replacement: https://agent.gawron.cloud/?project=b8ee990c-7449-4dfa-95fb-34c6c5a31866&workspace=bd69727e2c1a
    permanent: false
