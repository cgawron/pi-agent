apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pi-agent

resources:
  - composio-sealed-secret.yaml
  - deployment.yaml
  - ingress.yaml
  - initial-workspace.yaml
  - mcp-config.yaml
  - model-config.yaml
  - model-sealed-secret.yaml
  - service.yaml

configMapGenerator:
  - name: pi-agent-settings-config
    files:
      - settings.json

generatorOptions:
  disableNameSuffixHash: true
