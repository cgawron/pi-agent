apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pi-agent
  namespace: pi-agent
  annotations:
    traefik.frontend.passHostHeader: 'true'
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: pi-agent-pi-agent-initial-workspace@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: agent.gawron.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pi-agent-oauth2-proxy
                port:
                  number: 4180
