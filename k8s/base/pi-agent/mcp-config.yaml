apiVersion: v1
kind: ConfigMap
metadata:
  name: pi-agent-mcp-config
  namespace: pi-agent
data:
  mcp.json: |
    {
      "mcpServers": {
        "composio": {
          "url": "https://connect.composio.dev/mcp",
          "headers": {
            "x-consumer-api-key": "${COMPOSIO_API_KEY}"
          },
          "description": "Composio Connect"
        }
      }
    }
